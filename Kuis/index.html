<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kuis Terenkripsi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e5e7eb; padding: 20px; }
        .container { max-width: 750px; margin: auto; background: #111827; padding: 25px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,150,0.2); }
        h2 { text-align: center; color: #22c55e; }
        input { padding: 10px; width: 100%; margin-bottom: 15px; border-radius: 8px; border: none; background: #1f2937; color: white; box-sizing: border-box; }
        .soal { margin-bottom: 20px; padding: 15px; background: #1f2937; border-radius: 10px; border-left: 5px solid #22c55e; }
        button { padding: 12px; width: 100%; border: none; border-radius: 10px; background: #22c55e; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 Dekripsi AES-256-CBC</h2>
    
    <label><b>Kunci Dekripsi (Password):</b></label>
    <input type="password" id="kunci" placeholder="Masukkan password">

    <p><b>Upload file (.txt):</b></p>
    <input type="file" id="fileInput">

    <div id="quizForm"></div>
    <button id="btnSubmit" style="display:none;" onclick="hitungNilai()">Kirim Jawaban</button>
</div>

<script>
let dataSoal = [];

document.getElementById('fileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    const kunci = document.getElementById("kunci").value;

    if (!kunci) { alert("Masukkan kunci dulu!"); event.target.value = ""; return; }

    const reader = new FileReader();
    
    // PENTING: Menggunakan readAsBinaryString agar data tidak rusak
    reader.readAsBinaryString(file);

    reader.onload = function(e) {
        try {
            const encryptedData = e.target.result;
            
            // Dekripsi dengan mode CBC (CryptoJS otomatis mengenali format OpenSSL Salted)
            const decrypted = CryptoJS.AES.decrypt(
                CryptoJS.enc.Latin1.parse(encryptedData).toString(CryptoJS.enc.Base64), 
                kunci
            );
            
            const decryptedString = decrypted.toString(CryptoJS.enc.Utf8);
            
            if (!decryptedString) throw new Error("Gagal");
            
            dataSoal = JSON.parse(decryptedString);
            alert("Berhasil Dekripsi!");
            tampilkanSoal();
            document.getElementById("btnSubmit").style.display = "block";
        } catch (err) {
            alert("Gagal Dekripsi! Pastikan kunci benar dan file bukan file teks biasa.");
        }
    };
});

function tampilkanSoal() {
    let form = document.getElementById("quizForm");
    form.innerHTML = "";
    dataSoal.forEach((soal, index) => {
        let div = document.createElement("div");
        div.className = "soal";
        div.innerHTML = `<p><b>${index + 1}. ${soal.pertanyaan}</b></p>`;
        soal.opsi.forEach((ops, i) => {
            div.innerHTML += `<label><input type="radio" name="q${index}" value="${['a','b','c','d'][i]}"> ${ops}</label>`;
        });
        form.appendChild(div);
    });
}
</script>
</body>
</html>
