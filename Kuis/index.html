<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Terenkripsi</title>

<!-- CryptoJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background: #111827;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,255,150,0.2);
}

h2 {
    text-align: center;
    color: #22c55e;
}

input, button {
    padding: 10px;
    width: 100%;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    background: #1f2937;
    color: white;
}

button {
    background: linear-gradient(45deg, #22c55e, #16a34a);
    cursor: pointer;
}

button:hover {
    transform: scale(1.02);
}

/* BOX SOAL */
.soal {
    margin-bottom: 20px;
    padding: 15px;
    background: #1f2937;
    border-radius: 10px;
    border-left: 5px solid #22c55e;
}

.soal p {
    margin-bottom: 10px;
}

/* OPSI */
.opsi {
    margin-top: 10px;
}

.opsi label {
    display: grid;
    grid-template-columns: 20px 25px 1fr;
    align-items: start;
    gap: 8px;
    margin: 8px 0;
    cursor: pointer;
    padding: 8px;
    border-radius: 6px;
    transition: 0.2s;
}

/* RADIO */
.opsi input[type="radio"] {
    margin-top: 4px;
}

/* HURUF */
.huruf {
    font-weight: bold;
}

/* TEKS */
.teks {
    line-height: 1.4;
}

/* HOVER */
.opsi label:hover {
    background: #064e3b;
}

/* SELECTED */
.opsi label:has(input:checked) {
    background: #065f46;
    border: 1px solid #22c55e;
}

/* HASIL */
.result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #022c22;
    color: #4ade80;
    text-align: center;
    display: none;
}
</style>
</head>

<body>

<div class="container">

<a href="encrypt.html">
    <button>🔒 Halaman Encrypt Soal</button>
</a>

<h2>🔐 Kuis Terenkripsi</h2>

<input type="text" id="nama" placeholder="Nama Peserta">
<input type="password" id="kunci" placeholder="Masukkan Password">

<input type="file" id="fileInput" accept=".txt">

<button id="btnLoad">🔓 Load Soal</button>

<form id="quizForm"></form>

<button id="btnSubmit" style="display:none;">🚀 Kirim Jawaban</button>

<div class="result" id="hasil"></div>

</div>

<script>
let dataSoal = [];

// LOAD + DECRYPT
document.getElementById("btnLoad").addEventListener("click", function () {

    const file = document.getElementById("fileInput").files[0];
    const kunci = document.getElementById("kunci").value;

    if (!file) {
        alert("Upload file dulu!");
        return;
    }

    if (!kunci) {
        alert("Masukkan password!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {
        try {
            let encryptedData = e.target.result;

            const bytes = CryptoJS.AES.decrypt(encryptedData, kunci);
            const decryptedString = bytes.toString(CryptoJS.enc.Utf8);

            if (!decryptedString) {
                alert("❌ Password salah atau file rusak!");
                return;
            }

            dataSoal = JSON.parse(decryptedString);

            alert("✅ Soal berhasil dibuka!");

            tampilkanSoal();
            document.getElementById("btnSubmit").style.display = "block";

        } catch (err) {
            console.error(err);
            alert("❌ Gagal decrypt!");
        }
    };

    reader.readAsText(file, "UTF-8");
});

// TAMPILKAN SOAL
function tampilkanSoal() {
    let form = document.getElementById("quizForm");
    form.innerHTML = "";

    dataSoal.forEach((soal, index) => {
        let div = document.createElement("div");
        div.className = "soal";

        div.innerHTML = `<p><b>${index + 1}. ${soal.pertanyaan}</b></p>`;

        soal.opsi.forEach((ops, i) => {
            let huruf = ['a','b','c','d'][i];

            div.innerHTML += `
                <div class="opsi">
                    <label>
                        <input type="radio" name="q${index}" value="${huruf}">
                        <span class="huruf">${huruf}.</span>
                        <span class="teks">${ops}</span>
                    </label>
                </div>
            `;
        });

        form.appendChild(div);
    });
}

// HITUNG NILAI
document.getElementById("btnSubmit").addEventListener("click", function () {

    const nama = document.getElementById("nama").value.trim();

    if (!nama) {
        alert("Masukkan nama!");
        return;
    }

    let skor = 0;
    let form = document.forms["quizForm"];

    dataSoal.forEach((soal, index) => {
        let jawabanUser = form[`q${index}`]?.value;
        if (jawabanUser === soal.jawaban) skor++;
    });

    let nilai = (skor / dataSoal.length) * 100;

    const hasil = document.getElementById("hasil");
    hasil.style.display = "block";
    hasil.innerHTML = `
        👤 ${nama}<br>
        🎯 Nilai: ${nilai.toFixed(2)}<br>
        ✅ Benar: ${skor}/${dataSoal.length}
    `;
});
</script>

</body>
</html>
