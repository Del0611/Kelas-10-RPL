<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encrypt Soal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e5e7eb; padding: 20px; }
.container { max-width: 750px; margin: auto; background: #111827; padding: 25px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,150,0.2); }
h2 { text-align: center; color: #22c55e; }
input[type="file"], input[type="password"] {
    padding: 10px;
    width: 100%;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
    background: #1f2937;
    color: white;
}
button {
    margin-top: 15px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #22c55e, #16a34a);
    color: white;
    font-size: 16px;
    cursor: pointer;
}
button:hover { transform: scale(1.02); }
.result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #022c22;
    color: #4ade80;
    text-align: center;
    display: none;
}
a {
    color: #22c55e;
    text-decoration: none;
    display: block;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔒 Encrypt Soal</h2>

    <p><b>Upload file soal (.json / .txt):</b></p>
    <input type="file" id="fileInput" accept=".json,.txt">

    <label><b>Password Enkripsi:</b></label>
    <input type="password" id="kunci" placeholder="Masukkan password">

    <button onclick="encryptFile()">🔐 Encrypt & Download</button>

    <div class="result" id="hasil"></div>

    <a href="index.html">⬅ Kembali ke Halaman Kuis</a>
</div>

<script>
function encryptFile() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];
    const kunci = document.getElementById("kunci").value;

    if (!file) {
        alert("Upload file dulu!");
        return;
    }

    if (!kunci) {
        alert("Masukkan password!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const text = e.target.result.trim();

        if (!text) {
            alert("File kosong!");
            return;
        }

        // 🔍 Coba cek JSON (tidak wajib)
        try {
            JSON.parse(text);
        } catch (err) {
            console.warn("File bukan JSON valid, tetap dienkripsi...");
        }

        // 🔐 Encrypt AES
        const encrypted = CryptoJS.AES.encrypt(text, kunci).toString();

        // 💾 Download file hasil
        const blob = new Blob([encrypted], { type: "text/plain" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "soal_encrypted.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        // 🟢 Notifikasi
        const hasil = document.getElementById("hasil");
        hasil.style.display = "block";
        hasil.innerHTML = "✅ File berhasil dienkripsi & didownload!";
    };

    reader.onerror = function() {
        alert("Gagal membaca file!");
    };

    reader.readAsText(file);
}
</script>

</body>
</html>
